name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit and integration tests
        run: make test
      - name: Vet
        run: go vet ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race detector
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    needs: [check, race]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release artifact and checksum
        run: make release VERSION="${GITHUB_SHA::12}"
      - uses: actions/upload-artifact@v4
        with:
          name: classroom-agent-linux-amd64
          path: |
            build/classroom-agent-linux-amd64
            build/classroom-agent-linux-amd64.sha256
          if-no-files-found: error
