name: Build And Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    name: Scan Git History For Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-assets:
    name: Test And Build Release Assets
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run checks
        run: make check
      - name: Build release binaries
        run: |
          make release TARGET_ARCH=amd64 VERSION="${GITHUB_SHA::12}"
          make release TARGET_ARCH=arm64 VERSION="${GITHUB_SHA::12}"
      - name: Upload release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/classroom-agent-linux-amd64
            build/classroom-agent-linux-amd64.sha256
            build/classroom-agent-linux-arm64
            build/classroom-agent-linux-arm64.sha256
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/classroom-agent-linux-amd64
            build/classroom-agent-linux-amd64.sha256
            build/classroom-agent-linux-arm64
            build/classroom-agent-linux-arm64.sha256

  docker-build:
    name: Build Docker Image (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    needs: [secret-scan, release-assets]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Merge Docker Manifests
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: /tmp/digests
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest
      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do
            args+=("-t" "$tag")
          done
          for digest in *; do
            args+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"

  runner-images-build:
    name: Build ${{ matrix.component }} (${{ matrix.suffix }})
    runs-on: ${{ matrix.runner }}
    needs: [secret-scan, release-assets]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: Python Runtime
            image_suffix: python-runtime
            dockerfile: Dockerfile.python
            platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - component: Python Runtime
            image_suffix: python-runtime
            dockerfile: Dockerfile.python
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
          - component: Python Runner
            image_suffix: python-runner
            dockerfile: Dockerfile.runner
            platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - component: Python Runner
            image_suffix: python-runner
            dockerfile: Dockerfile.runner
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set image name
        run: echo "RUNNER_IMAGE_NAME=${IMAGE_NAME,,}-${{ matrix.image_suffix }}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.RUNNER_IMAGE_NAME }}
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.RUNNER_IMAGE_NAME }},push-by-digest=true,name-canonical=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image_suffix }}-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_suffix }}-${{ matrix.suffix }}
      - name: Export digest
        run: |
          mkdir -p "/tmp/${{ matrix.image_suffix }}-digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/${{ matrix.image_suffix }}-digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image_suffix }}-digests-${{ matrix.suffix }}
          path: /tmp/${{ matrix.image_suffix }}-digests/*
          if-no-files-found: error
          retention-days: 1

  runner-images-manifest:
    name: Merge ${{ matrix.component }} Manifests
    runs-on: ubuntu-latest
    needs: runner-images-build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: Python Runtime
            image_suffix: python-runtime
          - component: Python Runner
            image_suffix: python-runner
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.image_suffix }}-digests-*
          merge-multiple: true
          path: /tmp/${{ matrix.image_suffix }}-digests
      - name: Set image name
        run: echo "RUNNER_IMAGE_NAME=${IMAGE_NAME,,}-${{ matrix.image_suffix }}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.RUNNER_IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest
      - name: Create and push manifest list
        working-directory: /tmp/${{ matrix.image_suffix }}-digests
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=()
          for tag in "${tags[@]}"; do
            args+=("-t" "$tag")
          done
          for digest in *; do
            args+=("${REGISTRY}/${RUNNER_IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create "${args[@]}"
