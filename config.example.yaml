# 当前版本通过同名环境变量或启动参数读取配置；此文件用于部署时核对。
listen: ":8080"
database_path: "data/app.db"
students_csv: "data/students.csv"
deepseek_base_url: "https://api.deepseek.com"
deepseek_model: "deepseek-v4-flash"
deepseek_api_key: "${DEEPSEEK_API_KEY}"
qwen_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
qwen_model: "qwen3.8-flash"
qwen_api_key: "${QWEN_API_KEY}" # 可选；配置后教师可在课堂中切换
qwen_reasoning_effort: "low"
qwen_input_price_per_million: 0 # 按实际购买地域和模型填写
qwen_output_price_per_million: 0
bailian_deepseek_base_url: "https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
bailian_deepseek_model: "deepseek-v4-flash-0731"
bailian_deepseek_api_key: "${BAILIAN_DEEPSEEK_API_KEY}" # 可选；需与 base_url 同时配置
bailian_deepseek_input_price_per_million: 0 # 按实际购买地域和模型填写
bailian_deepseek_output_price_per_million: 0
web_search_provider: "disabled" # 首次启动初始值；运行中可由教师页选择 disabled、zhipu、deepseek、qwen 或 bailian-deepseek
deepseek_search_channel: "anthropic" # 首次启动初始值；教师页可按场次切换 anthropic 或 responses
zhipu_search_api_key: "${ZHIPU_SEARCH_API_KEY}" # provider=zhipu 时必填
zhipu_search_engine: "search_std" # search_std、search_pro、search_pro_sogou 或 search_pro_quark
runner_url: "" # 例如 http://10.16.100.20:8090；留空时不开放 Python
runner_token: "${RUNNER_TOKEN}"
runner_timeout: "20s"
max_python_code_chars: 12000
max_artifact_bytes: 10485760
admin_password: "${ADMIN_PASSWORD}"
anonymous_hmac_key: "${ANONYMOUS_HMAC_KEY}"
cookie_secure: false
llm_concurrency: 40
per_student_token_budget: 50000000
default_max_turns: 45
min_max_turns: 1
max_max_turns: 60
max_tool_calls: 30
max_reasoning_chars: 12000
max_memory_items: 100
max_memory_chars: 400
max_memory_tokens: 1200
memory_extract_timeout: "20s"
