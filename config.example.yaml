# 当前版本通过同名环境变量或启动参数读取配置；此文件用于部署时核对。
listen: ":8080"
database_path: "data/app.db"
students_csv: "data/students.csv"
deepseek_base_url: "https://api.deepseek.com"
deepseek_model: "deepseek-v4-flash"
deepseek_api_key: "${DEEPSEEK_API_KEY}"
brave_search_api_key: "${BRAVE_SEARCH_API_KEY}" # 可选；配置后服务端注册 web_search
admin_password: "${ADMIN_PASSWORD}"
anonymous_hmac_key: "${ANONYMOUS_HMAC_KEY}"
cookie_secure: false
require_name_initial: false
llm_concurrency: 40
per_student_token_budget: 200000
default_max_turns: 30
min_max_turns: 1
max_max_turns: 60
max_tool_calls: 8
max_reasoning_chars: 12000
max_memory_items: 30
max_memory_chars: 400
max_memory_tokens: 1200
memory_extract_timeout: "20s"
