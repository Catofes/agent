<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>课堂大屏</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #15213b;
        background: #eef3fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .connection {
        position: fixed;
        z-index: 2;
        right: 1.2rem;
        top: 1rem;
        padding: 0.45rem 0.75rem;
        border-radius: 999px;
        background: #fff;
        color: #51627f;
        box-shadow: 0 0.25rem 1rem #24436b20;
        font-size: 0.9rem;
      }
      .connection.error {
        color: #a32020;
        background: #fff0f0;
      }
      .screen {
        min-height: 100vh;
        padding: 4vh 5vw;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 3vh;
      }
      h1 {
        font-size: clamp(2rem, 4vw, 4rem);
        margin: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1.25fr;
        gap: 3vw;
      }
      .card {
        background: #fff;
        border-radius: 2vw;
        padding: 2vw;
        box-shadow: 0 1vw 3vw #24436b18;
        overflow: auto;
      }
      .label {
        color: #51627f;
        font-size: 1.3rem;
        font-weight: 700;
      }
      .content {
        font-size: clamp(1.1rem, 1.8vw, 2rem);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg {
        padding: 1.2vw;
        border-radius: 1vw;
        margin: 1vw 0;
        background: #f0f3f8;
      }
      .user {
        background: #e6ecff;
      }
      .empty {
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-size: 4vw;
        color: #62718a;
      }
      @media (max-width: 850px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link rel="stylesheet" href="/assets/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/assets/ui.css" />
  </head>
  <body class="screen-page">
    <div id="connection" class="connection" role="status">正在连接…</div>
    <main id="empty" class="empty">等待老师选择作品…</main>
    <main id="screen" class="screen" hidden>
      <header class="screen-header">
        <div>
          <div class="eyebrow">课堂作品展示</div>
          <h1 id="name"></h1>
        </div>
      </header>
      <nav class="screen-tabs" role="tablist" aria-label="大屏展示内容">
        <button
          id="configTab"
          class="screen-tab"
          type="button"
          role="tab"
          aria-controls="configPanel"
        >
          学生配置
        </button>
        <button
          id="conversationTab"
          class="screen-tab"
          type="button"
          role="tab"
          aria-controls="conversationPanel"
        >
          对话展示
        </button>
        <button
          id="testTab"
          class="screen-tab"
          type="button"
          role="tab"
          aria-controls="testPanel"
        >
          测试对话
        </button>
      </nav>
      <div class="screen-panels">
        <section
          id="configPanel"
          class="card design-summary screen-panel"
          role="tabpanel"
          aria-labelledby="configTab"
        >
          <div class="summary-mark">✦</div>
          <div class="design-columns">
            <div>
              <div class="label">Soul · 它是谁</div>
              <div id="persona" class="content"></div>
            </div>
            <div>
              <div class="label">Skill · 怎样做事</div>
              <div id="skill" class="content"></div>
            </div>
          </div>
          <div id="meta" class="meta"></div>
        </section>
        <section
          id="conversationPanel"
          class="card conversation-card screen-panel"
          role="tabpanel"
          aria-labelledby="conversationTab"
          hidden
        >
          <div class="conversation-titlebar">
            <div><span class="chat-icon">●</span><strong>对话展示</strong></div>
            <span id="conversationSummary">完整多轮记录</span>
          </div>
          <nav
            id="conversationTabs"
            class="conversation-tabs"
            role="tablist"
            aria-label="学生对话场次"
          ></nav>
          <div id="messages" class="content"></div>
        </section>
        <section
          id="testPanel"
          class="card conversation-card demo-card screen-panel"
          role="tabpanel"
          aria-labelledby="testTab"
          hidden
        >
          <div class="conversation-titlebar">
            <div><span class="chat-icon">●</span><strong id="demoName">现场测试</strong></div>
            <span id="demoStatus">等待教师端开始测试</span>
          </div>
          <div id="demoEmpty" class="demo-empty">教师端开始测试后，对话会实时显示在这里。</div>
          <div id="demoMessages" class="content" hidden></div>
        </section>
      </div>
    </main>
    <script src="/assets/vendor/katex/katex.min.js"></script>
    <script src="/assets/markdown.js"></script>
    <script>
      const $ = (id) => document.getElementById(id),
        es = new EventSource("/api/screen/events");
      let lastRevision = -1,
        lastDemoRevision = -1,
        currentDemoID = "",
        activeConversationKey = "",
        studentConversations = [];
      function selectTab(name) {
        for (const tab of ["config", "conversation", "test"]) {
          const selected = tab === name;
          $(`${tab}Panel`).hidden = !selected;
          $(`${tab}Tab`).classList.toggle("active", selected);
          $(`${tab}Tab`).setAttribute("aria-selected", String(selected));
        }
      }
      $("configTab").onclick = () => selectTab("config");
      $("conversationTab").onclick = () => selectTab("conversation");
      $("testTab").onclick = () => selectTab("test");
      selectTab("config");
      function connection(message, error = false) {
        $("connection").textContent = message;
        $("connection").classList.toggle("error", error);
      }
      async function acknowledge(spotlightId) {
        try {
          const r = await fetch("/api/screen/ack", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ spotlight_id: spotlightId }),
          });
          if (!r.ok)
            console.warn(
              "[screen] acknowledgement rejected",
              r.status,
              spotlightId,
            );
        } catch (error) {
          console.error("[screen] acknowledgement failed", error);
        }
      }
      function afterDOMUpdate(callback) {
        Promise.resolve().then(callback);
      }
      function toolLabel(name) {
        return {
          calculator: "计算器",
          web_search: "网上搜索",
          web_fetch: "网页访问",
          recall_memory: "读取 Memory",
        }[name] || name;
      }
      function renderMessages(target, messages, userLabel = "学生", showConversationHeadings = true) {
        const history = [];
        let conversation = "",
          processGroup = null;
        messages.forEach((m) => {
          if (showConversationHeadings && m.conversation && m.conversation !== conversation) {
            conversation = m.conversation;
            processGroup = null;
            const heading = document.createElement("div");
            heading.className = "conversation-heading";
            heading.textContent = conversation;
            history.push(heading);
          }
          const x = document.createElement("div");
          const role = document.createElement("strong"),
            body = document.createElement("div"),
            content = m.content || "发起工具调用";
          role.className = "message-role";
          role.textContent =
            m.role === "user"
              ? userLabel
              : m.role === "assistant"
                ? "Agent"
                : "工具";
          if (m.role === "assistant") MarkdownRenderer.render(body, content);
          else body.textContent = content;
          x.append(role, body);
          if (m.process) {
            if (!processGroup) {
              const details = document.createElement("details"),
                summary = document.createElement("summary"),
                items = document.createElement("div");
              details.className = "screen-process";
              items.className = "screen-process-items";
              details.append(summary, items);
              history.push(details);
              processGroup = { details, summary, items, count: 0 };
            }
            x.className = "screen-process-item " + m.role;
            processGroup.count += 1;
            processGroup.summary.textContent =
              `思考与行动过程（${processGroup.count} 条，点击展开）`;
            processGroup.items.append(x);
            return;
          }
          processGroup = null;
          x.className = "msg " + m.role + (m.current ? " current" : "");
          history.push(x);
        });
        target.replaceChildren(...history);
        target.scrollTop = target.scrollHeight;
      }
      function groupConversations(messages) {
        const groups = [], byKey = new Map();
        messages.forEach((message) => {
          const key = message.conversation_key || `legacy:${message.conversation || "default"}`;
          let group = byKey.get(key);
          if (!group) {
            group = {
              key,
              title: message.conversation || `对话 ${groups.length + 1}`,
              messages: [],
              current: false,
            };
            groups.push(group);
            byKey.set(key, group);
          }
          group.messages.push(message);
          group.current ||= Boolean(message.current);
        });
        return groups;
      }
      function selectConversation(key) {
        const group = studentConversations.find((item) => item.key === key);
        if (!group) return;
        activeConversationKey = key;
        Array.from($("conversationTabs").children).forEach((tab) => {
          const selected = tab.dataset.conversationKey === key;
          tab.classList.toggle("active", selected);
          tab.setAttribute("aria-selected", String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });
        renderMessages($("messages"), group.messages, "学生", false);
      }
      function renderStudentConversations(messages) {
        studentConversations = groupConversations(messages);
        const titleCounts = new Map();
        studentConversations.forEach((group) =>
          titleCounts.set(group.title, (titleCounts.get(group.title) || 0) + 1),
        );
        const titleIndexes = new Map();
        const tabs = studentConversations.map((group) => {
          const tab = document.createElement("button");
          const duplicateIndex = (titleIndexes.get(group.title) || 0) + 1;
          titleIndexes.set(group.title, duplicateIndex);
          tab.type = "button";
          tab.className = "conversation-tab";
          tab.dataset.conversationKey = group.key;
          tab.setAttribute("role", "tab");
          tab.textContent = titleCounts.get(group.title) > 1
            ? `${group.title}（${duplicateIndex}）`
            : group.title;
          tab.onclick = () => selectConversation(group.key);
          return tab;
        });
        $("conversationTabs").replaceChildren(...tabs);
        $("conversationTabs").hidden = tabs.length === 0;
        $("conversationSummary").textContent = tabs.length
          ? `共 ${tabs.length} 场对话`
          : "暂无对话";
        const selected = studentConversations.find((group) => group.current)
          || studentConversations.find((group) => group.key === activeConversationKey)
          || studentConversations.at(-1);
        if (selected) selectConversation(selected.key);
        else {
          activeConversationKey = "";
          $("messages").replaceChildren();
        }
      }
      function render(d) {
        $("empty").hidden = !d.empty;
        $("screen").hidden = d.empty;
        if (!d.empty) {
          $("name").textContent = d.name + " 的 Agent";
          $("persona").textContent = d.persona || "（未填写）";
          $("skill").textContent = d.skill_md || "（未填写）";
          $("meta").textContent =
            `装备：${(d.tools || []).map(toolLabel).join("、") || "无"}　｜　最大步数：${d.max_turns}`;
          renderStudentConversations(d.messages || []);
          $("messages").scrollTop = 0;
        }
        connection(`已连接·${new Date().toLocaleTimeString()}`);
        if (d.spotlight_id)
          afterDOMUpdate(() => acknowledge(d.spotlight_id));
      }
      function renderDemo(d) {
        const active = Boolean(d?.active);
        $("demoEmpty").hidden = active;
        $("demoMessages").hidden = !active;
        $("demoName").textContent = active ? `${d.name} 的现场测试` : "现场测试";
        $("demoStatus").textContent = active ? d.status || "等待教师输入" : "等待教师端开始测试";
        renderMessages($("demoMessages"), active ? d.messages || [] : [], "教师提问");
        if (active && d.id && d.id !== currentDemoID) {
          currentDemoID = d.id;
          selectTab("test");
        } else if (!active) {
          currentDemoID = "";
        }
      }
      es.onopen = () => {
        connection("大屏已连接");
        console.info("[screen] SSE connected");
      };
      es.onerror = () => {
        connection("连接中断，正在重连…", true);
        console.error("[screen] SSE disconnected");
      };
      es.addEventListener("screen", (event) => {
        try {
          const data = JSON.parse(event.data),
            revision = Number(data.revision);
          if (Number.isFinite(revision) && revision <= lastRevision) {
            console.info("[screen] stale event ignored", revision);
            return;
          }
          if (Number.isFinite(revision)) lastRevision = revision;
          console.info(
            "[screen] event received",
            data.spotlight_id || "snapshot",
            revision,
          );
          render(data);
        } catch (error) {
          connection("投屏渲染失败，请查看控制台", true);
          console.error("[screen] render failed", error);
        }
      });
      es.addEventListener("demo", (event) => {
        try {
          const data = JSON.parse(event.data),
            revision = Number(data.revision);
          if (Number.isFinite(revision) && revision <= lastDemoRevision) return;
          if (Number.isFinite(revision)) lastDemoRevision = revision;
          renderDemo(data);
        } catch (error) {
          connection("测试对话渲染失败，请查看控制台", true);
          console.error("[screen] demo render failed", error);
        }
      });
    </script>
  </body>
</html>
