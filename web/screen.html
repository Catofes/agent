<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课堂大屏</title><style>:root{font-family:system-ui,sans-serif;color:#15213b;background:#eef3fb}*{box-sizing:border-box}body{margin:0}.screen{min-height:100vh;padding:4vh 5vw;display:grid;grid-template-rows:auto 1fr;gap:3vh}h1{font-size:clamp(2rem,4vw,4rem);margin:0}.grid{display:grid;grid-template-columns:1fr 1.25fr;gap:3vw}.card{background:#fff;border-radius:2vw;padding:2vw;box-shadow:0 1vw 3vw #24436b18;overflow:auto}.label{color:#51627f;font-size:1.3rem;font-weight:700}.content{font-size:clamp(1.1rem,1.8vw,2rem);white-space:pre-wrap;word-break:break-word}.msg{padding:1.2vw;border-radius:1vw;margin:1vw 0;background:#f0f3f8}.user{background:#e6ecff}.empty{display:grid;place-items:center;min-height:100vh;font-size:4vw;color:#62718a}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main id="empty" class="empty">等待老师选择作品…</main><main id="screen" class="screen" hidden><h1 id="name"></h1><div class="grid"><section class="card"><div class="label">它是谁？</div><div id="persona" class="content"></div><div class="label" style="margin-top:2vh">技能手册</div><div id="skill" class="content"></div><div id="meta" class="label" style="margin-top:2vh"></div></section><section class="card"><div class="label">精彩对话与行动记录</div><div id="messages" class="content"></div></section></div></main><script>const $=id=>document.getElementById(id),es=new EventSource('/api/screen/events');es.addEventListener('screen',e=>{const d=JSON.parse(e.data);$('empty').hidden=!d.empty;$('screen').hidden=d.empty;if(d.empty)return;$('name').textContent=d.name+' 的 Agent';$('persona').textContent=d.persona||'（未填写）';$('skill').textContent=d.skill_md||'（未填写）';$('meta').textContent=`装备：${(d.tools||[]).join('、')||'无'}　｜　最大步数：${d.max_turns}`;$('messages').replaceChildren(...(d.messages||[]).map(m=>{const x=document.createElement('div');x.className='msg '+m.role;x.textContent=(m.role==='user'?'学生':m.role==='assistant'?'Agent':'工具')+'：'+(m.content||'发起工具调用');return x}))});</script></body></html>
