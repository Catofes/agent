<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>课堂大屏</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #15213b;
        background: #eef3fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .connection {
        position: fixed;
        z-index: 2;
        right: 1.2rem;
        top: 1rem;
        padding: 0.45rem 0.75rem;
        border-radius: 999px;
        background: #fff;
        color: #51627f;
        box-shadow: 0 0.25rem 1rem #24436b20;
        font-size: 0.9rem;
      }
      .connection.error {
        color: #a32020;
        background: #fff0f0;
      }
      .screen {
        min-height: 100vh;
        padding: 4vh 5vw;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 3vh;
      }
      h1 {
        font-size: clamp(2rem, 4vw, 4rem);
        margin: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1.25fr;
        gap: 3vw;
      }
      .card {
        background: #fff;
        border-radius: 2vw;
        padding: 2vw;
        box-shadow: 0 1vw 3vw #24436b18;
        overflow: auto;
      }
      .label {
        color: #51627f;
        font-size: 1.3rem;
        font-weight: 700;
      }
      .content {
        font-size: clamp(1.1rem, 1.8vw, 2rem);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg {
        padding: 1.2vw;
        border-radius: 1vw;
        margin: 1vw 0;
        background: #f0f3f8;
      }
      .user {
        background: #e6ecff;
      }
      .empty {
        display: grid;
        place-items: center;
        min-height: 100vh;
        font-size: 4vw;
        color: #62718a;
      }
      @media (max-width: 850px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link rel="stylesheet" href="/assets/ui.css" />
  </head>
  <body class="screen-page">
    <div id="connection" class="connection" role="status">正在连接…</div>
    <main id="empty" class="empty">等待老师选择作品…</main>
    <main id="screen" class="screen" hidden>
      <header class="screen-header">
        <div>
          <div class="eyebrow">课堂作品展示</div>
          <h1 id="name"></h1>
        </div>
      </header>
      <div class="grid">
        <section class="card design-summary">
          <div class="summary-mark">✦</div>
          <div class="label">Soul · 它是谁</div>
          <div id="persona" class="content"></div>
          <div class="label section-label">Skill · 怎样做事</div>
          <div id="skill" class="content"></div>
          <div id="meta" class="meta"></div>
        </section>
        <section id="conversationCard" class="card conversation-card">
          <div class="conversation-titlebar">
            <div><span class="chat-icon">●</span><strong>对话展示</strong></div>
            <span>完整多轮记录</span>
          </div>
          <div id="messages" class="content"></div>
        </section>
      </div>
    </main>
    <script src="/assets/markdown.js"></script>
    <script>
      const $ = (id) => document.getElementById(id),
        es = new EventSource("/api/screen/events");
      let lastRevision = -1;
      function connection(message, error = false) {
        $("connection").textContent = message;
        $("connection").classList.toggle("error", error);
      }
      async function acknowledge(spotlightId) {
        try {
          const r = await fetch("/api/screen/ack", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ spotlight_id: spotlightId }),
          });
          if (!r.ok)
            console.warn(
              "[screen] acknowledgement rejected",
              r.status,
              spotlightId,
            );
        } catch (error) {
          console.error("[screen] acknowledgement failed", error);
        }
      }
      function afterDOMUpdate(callback) {
        Promise.resolve().then(callback);
      }
      function render(d) {
        $("empty").hidden = !d.empty;
        $("screen").hidden = d.empty;
        if (!d.empty) {
          $("name").textContent = d.name + " 的 Agent";
          $("persona").textContent = d.persona || "（未填写）";
          $("skill").textContent = d.skill_md || "（未填写）";
          $("meta").textContent =
            `装备：${(d.tools || []).join("、") || "无"}　｜　最大步数：${d.max_turns}`;
          const history = [],
            messages = d.messages || [];
          let conversation = "";
          messages.forEach((m) => {
            if (m.conversation && m.conversation !== conversation) {
              conversation = m.conversation;
              const heading = document.createElement("div");
              heading.className = "conversation-heading";
              heading.textContent = conversation;
              history.push(heading);
            }
            const x = document.createElement("div");
            x.className =
              "msg " + m.role + (m.current ? " current" : "");
            const role = document.createElement("strong"),
              body = document.createElement("div"),
              content = m.content || "发起工具调用";
            role.className = "message-role";
            role.textContent =
              m.role === "user"
                ? "学生"
                : m.role === "assistant"
                  ? "Agent"
                  : "工具";
            if (m.role === "assistant") MarkdownRenderer.render(body, content);
            else body.textContent = content;
            x.append(role, body);
            history.push(x);
          });
          $("messages").replaceChildren(...history);
          $("conversationCard").scrollTop = 0;
        }
        connection(`已连接·${new Date().toLocaleTimeString()}`);
        if (d.spotlight_id)
          afterDOMUpdate(() => acknowledge(d.spotlight_id));
      }
      es.onopen = () => {
        connection("大屏已连接");
        console.info("[screen] SSE connected");
      };
      es.onerror = () => {
        connection("连接中断，正在重连…", true);
        console.error("[screen] SSE disconnected");
      };
      es.addEventListener("screen", (event) => {
        try {
          const data = JSON.parse(event.data),
            revision = Number(data.revision);
          if (Number.isFinite(revision) && revision <= lastRevision) {
            console.info("[screen] stale event ignored", revision);
            return;
          }
          if (Number.isFinite(revision)) lastRevision = revision;
          console.info(
            "[screen] event received",
            data.spotlight_id || "snapshot",
            revision,
          );
          render(data);
        } catch (error) {
          connection("投屏渲染失败，请查看控制台", true);
          console.error("[screen] render failed", error);
        }
      });
    </script>
  </body>
</html>
