<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>教师管理台</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f4f7fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input {
        font: inherit;
        min-height: 42px;
      }
      button {
        border: 0;
        border-radius: 9px;
        padding: 8px 14px;
        background: #315bea;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #e8edff;
        color: #2544a7;
      }
      button:disabled {
        opacity: 0.48;
        cursor: not-allowed;
      }
      .shell {
        max-width: 1280px;
        margin: auto;
        padding: 14px;
      }
      .card {
        background: #fff;
        border: 1px solid #dfe5ef;
        border-radius: 14px;
        padding: 14px;
        margin: 12px 0;
      }
      .top,
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .top {
        justify-content: space-between;
      }
      .wall {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .student {
        background: #fff;
        border: 2px solid #dce3ee;
        border-radius: 12px;
        padding: 11px;
        text-align: left;
        color: #172033;
        min-height: 132px;
      }
      .student.idle {
        border-color: #dbab27;
      }
      .student.active {
        border-color: #28a66a;
      }
      .student.offline {
        opacity: 0.7;
      }
      .student strong {
        font-size: 1.08rem;
      }
      .hidden {
        display: none !important;
      }
      .detail {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        white-space: pre-wrap;
      }
      .messages {
        max-height: 60vh;
        overflow: auto;
      }
      .msg {
        padding: 9px;
        margin: 7px 0;
        border-radius: 9px;
        background: #f0f3f8;
      }
      .msg.user {
        background: #e8edff;
      }
      .policy-grid {
        display: grid;
        grid-template-columns: minmax(180px, 0.8fr) minmax(240px, 1.2fr) minmax(260px, 2fr) auto;
        gap: 14px;
        align-items: end;
      }
      .policy-field {
        display: grid;
        gap: 7px;
      }
      .policy-field > span {
        color: #667085;
        font-size: 0.88rem;
        font-weight: 650;
      }
      .policy-switch > span:nth-child(2) {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 43px;
        color: #302c49;
      }
      .policy-switch input { width: auto; }
      .policy-switch small { color: #667085; line-height: 1.4; }
      .policy-tools {
        display: flex;
        min-height: 43px;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border: 1px solid #d9dce5;
        border-radius: 11px;
        background: #fff;
      }
      .policy-tools label {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .policy-tools input {
        min-height: auto;
        accent-color: #5b4ee8;
      }
      #policyStatus {
        min-height: 1.4em;
        margin: 8px 0 0;
        color: #667085;
      }
      @media (max-width: 1080px) {
        .policy-grid {
          grid-template-columns: 1fr 1fr;
        }
        #savePolicy {
          justify-self: start;
        }
      }
      @media (max-width: 760px) {
        .detail {
          grid-template-columns: 1fr;
        }
        .policy-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <link rel="stylesheet" href="/assets/ui.css" />
  </head>
  <body class="teacher-page">
    <main class="shell">
      <section
        id="login"
        class="card"
        style="max-width: 420px; margin: 15vh auto"
      >
        <h1>教师管理台</h1>
        <form id="loginForm">
          <input
            id="password"
            type="password"
            placeholder="教师口令"
            required
            style="width: 100%; padding: 10px"
          /><button style="width: 100%; margin-top: 10px">登录</button>
          <p id="error"></p>
        </form>
      </section>
      <section id="app" class="hidden">
        <header class="top">
          <div>
            <h1>课堂状态墙</h1>
            <div id="run"></div>
            <div id="screenConnection"></div>
            <div id="actionStatus" role="status"></div>
          </div>
          <div class="row">
            <button id="lock">全体锁定</button
            ><button id="newRun">新建场次</button
            ><button id="logout" class="secondary">退出</button>
          </div>
        </header>
        <section class="card" aria-labelledby="policyTitle">
          <div class="top">
            <div>
              <h2 id="policyTitle" style="margin-bottom: 4px">课堂能力</h2>
              <div class="status">统一控制本场课堂的 Skill、Memory 与 Agent 可用工具。</div>
            </div>
          </div>
          <div class="policy-grid">
            <label class="policy-field">
              <span>Memory 模式</span>
              <select id="policyMemoryMode">
                <option value="disabled">关闭</option>
                <option value="review_required">学生确认后记住</option>
                <option value="adaptive">自然积累</option>
              </select>
            </label>
            <label class="policy-field policy-switch">
              <span>Skill</span>
              <span><input id="policySkillsEnabled" type="checkbox" /> 允许学生创建和使用 Skill</span>
              <small>关闭后学生端不显示 Skill，已保存内容会保留但不会交给 Agent。</small>
            </label>
            <div class="policy-field">
              <span>允许使用的工具</span>
              <div id="policyTools" class="policy-tools"></div>
            </div>
            <button id="savePolicy">保存课堂设置</button>
          </div>
          <p id="policyStatus" role="status"></p>
        </section>
        <section id="wall" class="wall"></section>
        <section id="detailCard" class="card hidden">
          <div class="top">
            <h2 id="studentTitle"></h2>
            <div>
              <button id="spotlight">投屏展示</button
              ><button id="close">返回状态墙</button>
              <div id="spotlightStatus" role="status"></div>
            </div>
          </div>
          <div class="detail">
            <div>
              <h3>设计</h3>
              <div id="design"></div>
            </div>
            <div>
              <h3>对话</h3>
              <div id="messages" class="messages"></div>
            </div>
          </div>
        </section>
      </section>
    </main>
    <script src="/assets/markdown.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let wallState = null,
        current = null,
        es = null,
        lockBusy = false,
        runBusy = false,
        policyDirty = false,
        policyBusy = false;
      async function api(url, opt = {}) {
        const r = await fetch(url, {
          ...opt,
          headers: {
            "Content-Type": "application/json",
            ...(opt.headers || {}),
          },
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error?.message || "请求失败");
        return d;
      }
      $("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        try {
          await api("/api/teacher/login", {
            method: "POST",
            body: JSON.stringify({ password: $("password").value }),
          });
          start();
        } catch (x) {
          $("error").textContent = x.message;
        }
      };
      function start() {
        $("login").classList.add("hidden");
        $("app").classList.remove("hidden");
        es = new EventSource("/api/teacher/wall");
        es.addEventListener("wall", (e) => {
          wallState = JSON.parse(e.data);
          renderWall();
        });
        es.onerror = () => {
          $("run").textContent = "状态连接中断，正在重连…";
        };
      }
      api("/api/teacher/me")
        .then((d) => {
          if (d.role === "teacher") start();
        })
        .catch(() => {});
      function renderWall() {
        $("run").textContent =
          `${wallState.run.name}｜${wallState.students.length} 人｜${wallState.run.locked ? "已锁定" : "操作中"}`;
        const screens = Number(wallState.screen_connections || 0);
        $("screenConnection").textContent = screens
          ? `🟢 大屏已连接${screens > 1 ? `（${screens} 个）` : ""}`
          : "🔴 大屏未连接";
        $("lock").textContent = lockBusy
          ? "正在切换…"
          : wallState.run.locked
            ? "全体解锁"
            : "全体锁定";
        $("lock").disabled = lockBusy;
        $("lock").setAttribute("aria-pressed", String(wallState.run.locked));
        renderPolicy();
        const now = new Date(wallState.server_time);
        $("wall").replaceChildren(
          ...wallState.students.map((s) => {
            const idle =
                !s.last_seen_at || now - new Date(s.last_seen_at) > 180000,
              b = document.createElement("button");
            b.className = `student ${!s.logged_in ? "offline" : idle ? "idle" : "active"}`;
            b.append(
              t(`${s.id}　${s.name}`, "strong"),
              t(s.logged_in ? "已登录" : "未登录"),
              t(
                `人设 ${s.has_persona ? "✓" : "…"}　Skill ${wallState.policy.skills_enabled === false ? "关闭" : s.has_skill ? "✓" : "…"}`,
              ),
              t(`💬 ${s.chat_turns} 轮`),
              t(!s.logged_in ? "⚫ 离线" : idle ? "🟡 idle" : "🟢 活跃"),
            );
            b.onclick = () => openStudent(s.id);
            return b;
          }),
        );
      }
      function toolLabel(name) {
        return {
          calculator: "计算器",
          web_search: "网上搜索",
          web_fetch: "网页访问",
          python_execute: "Python 执行",
          recall_memory: "读取 Memory",
        }[name] || name;
      }
      function selectedPolicy() {
        return {
          memory_mode: $("policyMemoryMode").value,
          skills_enabled: $("policySkillsEnabled").checked,
          allowed_tools: [...$("policyTools").querySelectorAll("input:checked")].map(
            (input) => input.value,
          ),
        };
      }
      function renderPolicy() {
        if (!wallState?.policy) return;
        const available = wallState.available_tools || [];
        const key = available.join("\u0000");
        if ($("policyTools").dataset.key !== key) {
          $("policyTools").dataset.key = key;
          $("policyTools").replaceChildren(
            ...available.map((name) => {
              const label = document.createElement("label"),
                input = document.createElement("input");
              input.type = "checkbox";
              input.value = name;
              input.onchange = markPolicyDirty;
              label.append(input, document.createTextNode(toolLabel(name)));
              return label;
            }),
          );
        }
        if (!policyDirty) {
          $("policyMemoryMode").value = wallState.policy.memory_mode;
          $("policySkillsEnabled").checked = wallState.policy.skills_enabled !== false;
          const enabled = new Set(wallState.policy.allowed_tools || []);
          $("policyTools")
            .querySelectorAll("input")
            .forEach((input) => (input.checked = enabled.has(input.value)));
        }
        $("policyMemoryMode").disabled = policyBusy;
        $("policySkillsEnabled").disabled = policyBusy;
        $("policyTools")
          .querySelectorAll("input")
          .forEach((input) => (input.disabled = policyBusy));
        $("savePolicy").disabled = policyBusy || !policyDirty;
        $("savePolicy").textContent = policyBusy ? "正在保存…" : "保存课堂设置";
      }
      function markPolicyDirty() {
        policyDirty = true;
        $("policyStatus").textContent = "设置有改动，保存后立即对全班生效";
        renderPolicy();
      }
      $("policyMemoryMode").onchange = markPolicyDirty;
      $("policySkillsEnabled").onchange = markPolicyDirty;
      $("savePolicy").onclick = async () => {
        if (!wallState || policyBusy || !policyDirty) return;
        policyBusy = true;
        renderPolicy();
        try {
          const policy = await api("/api/teacher/policy", {
            method: "PUT",
            body: JSON.stringify(selectedPolicy()),
          });
          wallState.policy = policy;
          policyDirty = false;
          $("policyStatus").textContent = "课堂设置已保存，并同步给学生";
        } catch (e) {
          $("policyStatus").textContent = "保存失败：" + e.message;
        } finally {
          policyBusy = false;
          renderPolicy();
        }
      };
      function t(v, tag = "div") {
        const e = document.createElement(tag);
        e.textContent = v;
        return e;
      }
      $("lock").onclick = async () => {
        if (!wallState || lockBusy) return;
        const target = !wallState.run.locked;
        lockBusy = true;
        $("actionStatus").textContent = "";
        renderWall();
        try {
          const d = await api("/api/teacher/lock", {
            method: "POST",
            body: JSON.stringify({ locked: target }),
          });
          wallState.run.locked = d.locked;
          $("actionStatus").textContent = d.locked
            ? "全班已锁定"
            : "全班已解锁";
        } catch (e) {
          $("actionStatus").textContent = "切换失败：" + e.message;
        } finally {
          lockBusy = false;
          renderWall();
        }
      };
      $("newRun").onclick = async () => {
        if (runBusy) return;
        const name = prompt("新场次名称")?.trim();
        if (!name) return;
        if (
          !confirm(
            "新建场次会结束当前场次，并让所有学生重新登录。\n\n普通重启服务不会让学生重新登录；旧场次数据也会保留。\n\n确认新建吗？",
          )
        )
          return;
        runBusy = true;
        $("newRun").disabled = true;
        $("actionStatus").textContent = "正在新建场次…";
        try {
          await api("/api/teacher/run", {
            method: "POST",
            body: JSON.stringify({ name, ...selectedPolicy() }),
          });
          $("actionStatus").textContent = "新场次已创建，请让学生重新登录";
        } catch (e) {
          $("actionStatus").textContent = "新建失败：" + e.message;
        } finally {
          runBusy = false;
          $("newRun").disabled = false;
        }
      };
      $("logout").onclick = async () => {
        $("logout").disabled = true;
        try {
          await api("/api/teacher/logout", { method: "POST" });
          es?.close();
          location.reload();
        } catch (e) {
          $("actionStatus").textContent = "退出失败：" + e.message;
          $("logout").disabled = false;
        }
      };
      async function openStudent(id) {
        const d = await api("/api/teacher/student/" + encodeURIComponent(id));
        current = d;
        $("studentTitle").textContent = `${d.student.id}　${d.student.name}`;
        const skills = (d.skills || [])
          .map(
            (skill) =>
              `${skill.enabled ? "✓" : "○"} ${skill.name}\n能力：${skill.summary || "（未填写）"}\n何时使用：${skill.when_to_use || "（未填写）"}\n触发：${skill.trigger_mode === "explicit" ? "仅明确调用" : "自动判断"}`,
          )
          .join("\n\n");
        const skillDisplay =
          wallState.policy.skills_enabled === false
            ? "本场课堂已关闭（原内容仍保留）"
            : skills || "（未创建）";
        $("design").textContent =
          `人设\n${d.design.persona || "（未填写）"}\n\nSkill 目录\n${skillDisplay}\n\n装备：${d.design.tools.map(toolLabel).join("、") || "无"}\n最大步数：${d.design.max_turns}`;
        $("messages").replaceChildren(
          ...d.messages.map((m) => {
            const e = document.createElement("div"),
              role = t(
                m.role === "user"
                  ? "学生"
                  : m.role === "assistant"
                    ? "Agent"
                    : "工具",
                "strong",
              ),
              content = document.createElement("div"),
              value = m.content || m.tool_calls;
            e.className = "msg " + m.role;
            role.className = "message-role";
            if (m.role === "assistant" && !m.tool_calls)
              MarkdownRenderer.render(content, value);
            else content.textContent = value;
            e.append(role, content);
            return e;
          }),
        );
        $("spotlightStatus").textContent = "";
        $("detailCard").classList.remove("hidden");
        $("wall").classList.add("hidden");
      }
      $("close").onclick = () => {
        $("detailCard").classList.add("hidden");
        $("wall").classList.remove("hidden");
        current = null;
      };
      $("spotlight").onclick = async () => {
        if (!current) return;
        $("spotlight").disabled = true;
        $("spotlightStatus").textContent = "正在等待大屏确认…";
        try {
          const d = await api("/api/teacher/spotlight", {
            method: "POST",
            body: JSON.stringify({ id: current.student.id, turn_id: "" }),
          });
          $("spotlightStatus").textContent = d.delivered
            ? "大屏已确认显示"
            : "内容已保存，但未收到大屏显示确认，请检查大屏连接";
        } catch (e) {
          $("spotlightStatus").textContent = "推送失败：" + e.message;
        } finally {
          $("spotlight").disabled = false;
        }
      };
    </script>
  </body>
</html>
