<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>教师管理台</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f4f7fb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input {
        font: inherit;
        min-height: 42px;
      }
      button {
        border: 0;
        border-radius: 9px;
        padding: 8px 14px;
        background: #315bea;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      button.secondary {
        background: #e8edff;
        color: #2544a7;
      }
      button:disabled {
        opacity: 0.48;
        cursor: not-allowed;
      }
      .shell {
        max-width: 1280px;
        margin: auto;
        padding: 14px;
      }
      .card {
        background: #fff;
        border: 1px solid #dfe5ef;
        border-radius: 14px;
        padding: 14px;
        margin: 12px 0;
      }
      .top,
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .top {
        justify-content: space-between;
      }
      .wall {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .student {
        background: #fff;
        border: 2px solid #dce3ee;
        border-radius: 12px;
        padding: 11px;
        text-align: left;
        color: #172033;
        min-height: 132px;
      }
      .student.idle {
        border-color: #dbab27;
      }
      .student.active {
        border-color: #28a66a;
      }
      .student.offline {
        opacity: 0.7;
      }
      .student strong {
        font-size: 1.08rem;
      }
      .hidden {
        display: none !important;
      }
      .detail {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        white-space: pre-wrap;
      }
      .messages {
        max-height: 60vh;
        overflow: auto;
      }
      .msg {
        padding: 9px;
        margin: 7px 0;
        border-radius: 9px;
        background: #f0f3f8;
      }
      .msg.user {
        background: #e8edff;
      }
      .usage-panel {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) minmax(220px, 2fr) auto;
        align-items: center;
        gap: 12px;
        margin: 12px 0 16px;
        padding: 12px 14px;
        border: 1px solid #dfe5ef;
        border-radius: 12px;
        background: #f8faff;
      }
      .usage-copy { display: grid; gap: 3px; }
      .usage-copy small { color: #667085; }
      .usage-meter { width: 100%; accent-color: #5b4ee8; }
      .policy-stack {
        display: grid;
        gap: 16px;
        margin-top: 16px;
      }
      .policy-section {
        padding: 15px;
        border: 1px solid #e1e5ee;
        border-radius: 12px;
        background: #fafbfe;
      }
      .policy-section h3 {
        margin: 0 0 12px;
        font-size: 0.98rem;
      }
      .policy-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }
      .policy-section-head h3 { margin: 0; }
      .policy-select-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .policy-field {
        display: grid;
        gap: 7px;
        min-width: 0;
      }
      .policy-field > span {
        color: #667085;
        font-size: 0.88rem;
        font-weight: 650;
      }
      .policy-switch {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #302c49;
        font-weight: 650;
        cursor: pointer;
      }
      .policy-switch input { width: auto; }
      .policy-tools {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        min-height: 43px;
        gap: 8px;
      }
      .policy-tools label {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        padding: 10px 12px;
        border: 1px solid #d9dce5;
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
      }
      .policy-tools label:has(input:checked) {
        border-color: #c8c3f7;
        background: #f3f1ff;
      }
      .policy-tools input {
        min-height: auto;
        accent-color: #5b4ee8;
      }
      .preset-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
      .preset-group { min-width: 0; margin: 0; padding: 11px; border: 1px solid #e1e5ee; border-radius: 10px; }
      .preset-group legend { padding: 0 5px; color: #475467; font-size: .84rem; font-weight: 700; }
      .preset-group label { display: grid; grid-template-columns: auto 1fr; align-items: start; gap: 7px; padding: 6px 2px; }
      .preset-group label:has(input:checked) strong { color: #4b3fd0; }
      .preset-group label span { display: grid; gap: 2px; }
      .preset-group label small { color: #667085; font-weight: 400; line-height: 1.35; }
      .preset-group input { width: auto; margin-top: 3px; }
      #policyStatus {
        min-height: 1.4em;
        margin: 12px 0 0;
        color: #667085;
      }
      .policy-actions { display: flex; align-items: center; justify-content: flex-end; }
      @media (max-width: 1080px) {
        .policy-select-grid, .policy-tools {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 760px) {
        .detail {
          grid-template-columns: 1fr;
        }
        .usage-panel { grid-template-columns: 1fr; }
        .policy-select-grid, .policy-tools {
          grid-template-columns: 1fr;
        }
        .preset-groups { grid-template-columns: 1fr; }
        .policy-section-head { align-items: flex-start; flex-direction: column; }
        .policy-actions { justify-content: stretch; }
        #savePolicy { width: 100%; }
      }
    </style>
    <link rel="stylesheet" href="/assets/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/assets/ui.css" />
  </head>
  <body class="teacher-page">
    <main class="shell">
      <section
        id="login"
        class="card"
        style="max-width: 420px; margin: 15vh auto"
      >
        <h1>教师管理台</h1>
        <form id="loginForm">
          <input
            id="password"
            type="password"
            placeholder="教师口令"
            required
            style="width: 100%; padding: 10px"
          /><button style="width: 100%; margin-top: 10px">登录</button>
          <p id="error"></p>
        </form>
      </section>
      <section id="app" class="hidden">
        <header class="top">
          <div>
            <h1>课堂状态墙</h1>
            <div id="run"></div>
            <div id="screenConnection"></div>
            <div id="actionStatus" role="status"></div>
          </div>
          <div class="row">
            <button id="lock">全体锁定</button
            ><button id="newRun">新建场次</button
            ><button id="logout" class="secondary">退出</button>
          </div>
        </header>
        <section class="card" aria-labelledby="policyTitle">
          <div class="top">
            <h2 id="policyTitle">课堂能力</h2>
          </div>
          <div class="policy-stack">
            <section class="policy-section" aria-labelledby="serviceSettingsTitle">
              <h3 id="serviceSettingsTitle">服务与记忆</h3>
              <div class="policy-select-grid">
                <label class="policy-field">
                  <span>模型服务</span>
                  <select id="policyModelProvider"></select>
                </label>
                <label class="policy-field">
                  <span>联网搜索</span>
                  <select id="policySearchProvider"></select>
                </label>
                <label class="policy-field" id="deepSeekSearchChannelField">
                  <span>搜索通道</span>
                  <select id="policyDeepSeekSearchChannel"></select>
                </label>
                <label class="policy-field">
                  <span>Memory</span>
                  <select id="policyMemoryMode">
                    <option value="disabled">关闭</option>
                    <option value="review_required">学生确认后记住</option>
                    <option value="adaptive">自然积累</option>
                  </select>
                </label>
              </div>
            </section>
            <section class="policy-section" aria-labelledby="skillSettingsTitle">
              <div class="policy-section-head">
                <h3 id="skillSettingsTitle">Skill</h3>
                <label class="policy-switch"><input id="policySkillsEnabled" type="checkbox" />允许学生使用 Skill</label>
              </div>
              <div id="policyPresets" class="preset-groups"></div>
            </section>
            <section class="policy-section" aria-labelledby="toolSettingsTitle">
              <h3 id="toolSettingsTitle">工具</h3>
              <div id="policyTools" class="policy-tools"></div>
            </section>
            <div class="policy-actions">
              <button id="savePolicy" type="button">保存课堂设置</button>
            </div>
          </div>
          <p id="policyStatus" role="status"></p>
        </section>
        <section id="wall" class="wall"></section>
        <section id="detailCard" class="card hidden">
          <div class="top">
            <h2 id="studentTitle"></h2>
            <div>
              <button id="spotlight">投屏展示</button
              ><button id="startDemo" class="secondary">开始大屏测试</button
              ><button id="close">返回状态墙</button>
              <div id="spotlightStatus" role="status"></div>
            </div>
          </div>
          <section id="usagePanel" class="usage-panel" aria-label="本场模型用量">
            <div class="usage-copy">
              <strong id="usageTotal"></strong>
              <small id="usageBreakdown"></small>
            </div>
            <progress id="usageMeter" class="usage-meter" max="1" value="0"></progress>
            <button id="resetUsage" class="secondary" type="button">重置用量</button>
          </section>
          <div class="detail">
            <div>
              <h3>设计</h3>
              <div id="design"></div>
            </div>
            <div>
              <h3>对话</h3>
              <div id="messages" class="messages"></div>
            </div>
          </div>
          <section id="demoControl" class="teacher-demo hidden" aria-labelledby="demoTitle">
            <div class="top">
              <div>
                <h3 id="demoTitle">大屏测试对话</h3>
                <div id="demoStatus" class="status">等待开始</div>
              </div>
              <button id="stopDemo" class="danger" type="button">结束测试</button>
            </div>
            <div id="demoMessages" class="messages demo-chat-log"></div>
            <form id="demoForm" class="row">
              <textarea id="demoInput" maxlength="12000" placeholder="输入要在大屏上演示的问题"></textarea>
              <button id="sendDemo" type="submit">发送测试问题</button>
            </form>
          </section>
        </section>
      </section>
    </main>
    <script src="/assets/vendor/katex/katex.min.js"></script>
    <script src="/assets/markdown.js"></script>
    <script src="/assets/ndjson-stream.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);
      let wallState = null,
        current = null,
        es = null,
        lockBusy = false,
        runBusy = false,
        policyDirty = false,
        policyBusy = false,
        demoState = null,
        demoStudentID = null,
        demoController = null,
        usageResetBusy = false;
      async function api(url, opt = {}) {
        const r = await fetch(url, {
          ...opt,
          headers: {
            "Content-Type": "application/json",
            ...(opt.headers || {}),
          },
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error?.message || "请求失败");
        return d;
      }
      $("loginForm").onsubmit = async (e) => {
        e.preventDefault();
        try {
          await api("/api/teacher/login", {
            method: "POST",
            body: JSON.stringify({ password: $("password").value }),
          });
          start();
        } catch (x) {
          $("error").textContent = x.message;
        }
      };
      function start() {
        $("login").classList.add("hidden");
        $("app").classList.remove("hidden");
        es = new EventSource("/api/teacher/wall");
        es.addEventListener("wall", (e) => {
          wallState = JSON.parse(e.data);
          renderWall();
        });
        es.onerror = () => {
          $("run").textContent = "状态连接中断，正在重连…";
        };
      }
      api("/api/teacher/me")
        .then((d) => {
          if (d.role === "teacher") start();
        })
        .catch(() => {});
      function renderWall() {
        $("run").textContent =
          `${wallState.run.name}｜${wallState.students.length} 人｜${wallState.run.locked ? "已锁定" : "操作中"}`;
        const screens = Number(wallState.screen_connections || 0);
        $("screenConnection").textContent = screens
          ? `🟢 大屏已连接${screens > 1 ? `（${screens} 个）` : ""}`
          : "🔴 大屏未连接";
        $("lock").textContent = lockBusy
          ? "正在切换…"
          : wallState.run.locked
            ? "全体解锁"
            : "全体锁定";
        $("lock").disabled = lockBusy;
        $("lock").setAttribute("aria-pressed", String(wallState.run.locked));
        renderPolicy();
        const now = new Date(wallState.server_time);
        $("wall").replaceChildren(
          ...wallState.students.map((s) => {
            const idle =
                !s.last_seen_at || now - new Date(s.last_seen_at) > 180000,
              b = document.createElement("button");
            b.className = `student ${!s.logged_in ? "offline" : idle ? "idle" : "active"}`;
            b.append(
              t(`${s.id}　${s.name}`, "strong"),
              t(s.logged_in ? "已登录" : "未登录"),
              t(
                `人设 ${s.has_persona ? "✓" : "…"}　Skill ${wallState.policy.skills_enabled === false ? "关闭" : s.has_skill ? "✓" : "…"}`,
              ),
              t(`💬 ${s.chat_turns} 轮`),
              t(`用量 ${formatTokens(Number(s.tokens_in || 0) + Number(s.tokens_out || 0))} / ${formatTokens(Number(wallState.student_token_budget || 0))}`),
              t(!s.logged_in ? "⚫ 离线" : idle ? "🟡 idle" : "🟢 活跃"),
            );
            b.onclick = () => openStudent(s.id);
            return b;
          }),
        );
      }
      function formatTokens(value) {
        return new Intl.NumberFormat("zh-CN", {
          notation: value >= 10000 ? "compact" : "standard",
          maximumFractionDigits: 2,
        }).format(Math.max(0, Number(value) || 0));
      }
      function renderStudentUsage() {
        if (!current) return;
        const input = Number(current.usage?.tokens_in || 0),
          output = Number(current.usage?.tokens_out || 0),
          used = input + output,
          budget = Number(current.student_token_budget || wallState?.student_token_budget || 0),
          percent = budget > 0 ? (used / budget) * 100 : 0;
        $("usageTotal").textContent = `本场已用 ${formatTokens(used)} / ${formatTokens(budget)} token（${percent < 0.01 && percent > 0 ? "<0.01" : percent.toFixed(2)}%）`;
        $("usageBreakdown").textContent = `输入 ${formatTokens(input)}，输出 ${formatTokens(output)}；重置不会删除对话、设计或 Memory`;
        $("usageMeter").max = Math.max(1, budget);
        $("usageMeter").value = Math.min(used, Math.max(1, budget));
        $("resetUsage").disabled = usageResetBusy || used === 0;
        $("resetUsage").textContent = usageResetBusy ? "正在重置…" : "重置用量";
      }
      function toolLabel(name) {
        return {
          web_search: "网上搜索",
          web_fetch: "网页访问",
          python_execute: "Python 执行",
          recall_memory: "读取 Memory",
        }[name] || name;
      }
      function selectedPolicy() {
        return {
          model_provider: $("policyModelProvider").value,
          search_provider: $("policySearchProvider").value,
          deepseek_search_channel: $("policyDeepSeekSearchChannel").value,
          memory_mode: $("policyMemoryMode").value,
          skills_enabled: $("policySkillsEnabled").checked,
          preset_skills: [...$("policyPresets").querySelectorAll("input:checked")].map(
            (input) => input.value,
          ),
          allowed_tools: [...$("policyTools").querySelectorAll("input:checked")].map(
            (input) => input.value,
          ),
        };
      }
      function renderPolicy() {
        if (!wallState?.policy) return;
        const modelProviderLabel = (name) =>
          ({ deepseek: "DeepSeek 官方", "bailian-deepseek": "DeepSeek（阿里云百炼）", qwen: "Qwen" })[name] || name;
        const searchProviderLabel = (name) =>
          ({ deepseek: "DeepSeek 官方搜索", "bailian-deepseek": "百炼内置搜索", qwen: "千问搜索", zhipu: "智谱搜索", disabled: "关闭搜索" })[
            name
          ] || name;
        const modelProviders = wallState.available_model_providers || [];
        const modelKey = modelProviders.join("\u0000");
        if ($("policyModelProvider").dataset.key !== modelKey) {
          $("policyModelProvider").dataset.key = modelKey;
          $("policyModelProvider").replaceChildren(
            ...modelProviders.map((name) => {
              const option = document.createElement("option");
              option.value = name;
              option.textContent = modelProviderLabel(name);
              return option;
            }),
          );
        }
        const searchProviders = wallState.available_search_providers || [];
        const searchKey = searchProviders.join("\u0000");
        if ($("policySearchProvider").dataset.key !== searchKey) {
          $("policySearchProvider").dataset.key = searchKey;
          $("policySearchProvider").replaceChildren(
            ...searchProviders.map((name) => {
              const option = document.createElement("option");
              option.value = name;
              option.textContent = searchProviderLabel(name);
              return option;
            }),
          );
        }
        const searchChannels = wallState.available_deepseek_search_channels || ["anthropic", "responses"];
        const channelKey = searchChannels.join("\u0000");
        if ($("policyDeepSeekSearchChannel").dataset.key !== channelKey) {
          $("policyDeepSeekSearchChannel").dataset.key = channelKey;
          $("policyDeepSeekSearchChannel").replaceChildren(
            ...searchChannels.map((name) => {
              const option = document.createElement("option");
              option.value = name;
              option.textContent = name === "anthropic" ? "Anthropic Messages" : "Responses";
              return option;
            }),
          );
        }
        const available = wallState.available_tools || [];
        const key = available.join("\u0000");
        if ($("policyTools").dataset.key !== key) {
          $("policyTools").dataset.key = key;
          $("policyTools").replaceChildren(
            ...available.map((name) => {
              const label = document.createElement("label"),
                input = document.createElement("input");
              input.type = "checkbox";
              input.value = name;
              input.onchange = markPolicyDirty;
              label.append(input, document.createTextNode(toolLabel(name)));
              return label;
            }),
          );
        }
        const presets = wallState.available_preset_skills || [],
          presetKey = presets.map((item) => `${item.id}:${item.name}`).join("\u0000");
        if ($("policyPresets").dataset.key !== presetKey) {
          $("policyPresets").dataset.key = presetKey;
          const categoryLabels = { basic: "基础", physics: "物理", math: "数学" };
          $("policyPresets").replaceChildren(
            ...Object.entries(categoryLabels).map(([category, title]) => {
              const group = document.createElement("fieldset"),
                legend = document.createElement("legend");
              group.className = "preset-group";
              legend.textContent = title;
              group.append(legend);
              presets.filter((item) => item.category === category).forEach((item) => {
                const label = document.createElement("label"),
                  input = document.createElement("input"),
                  copy = document.createElement("span");
                input.type = "checkbox";
                input.value = item.id;
                input.onchange = markPolicyDirty;
                copy.append(t(item.name, "strong"), t(item.summary, "small"));
                label.append(input, copy);
                group.append(label);
              });
              return group;
            }),
          );
        }
        if (!policyDirty) {
          $("policyModelProvider").value = wallState.policy.model_provider;
          $("policySearchProvider").value = wallState.policy.search_provider;
          $("policyDeepSeekSearchChannel").value =
            wallState.policy.deepseek_search_channel || "anthropic";
          $("policyMemoryMode").value = wallState.policy.memory_mode;
          $("policySkillsEnabled").checked = wallState.policy.skills_enabled !== false;
          const enabled = new Set(wallState.policy.allowed_tools || []);
          $("policyTools")
            .querySelectorAll("input")
            .forEach((input) => (input.checked = enabled.has(input.value)));
          const enabledPresets = new Set(wallState.policy.preset_skills || []);
          $("policyPresets")
            .querySelectorAll("input")
            .forEach((input) => (input.checked = enabledPresets.has(input.value)));
          const loadedRevision = String(wallState.policy.revision || "");
          if (!policyBusy && $("policyStatus").dataset.revision !== loadedRevision) {
            $("policyStatus").dataset.revision = loadedRevision;
            $("policyStatus").textContent = `已从服务器读取课堂设置（版本 ${loadedRevision || "未知"}）：${modelProviderLabel(wallState.policy.model_provider)} / ${searchProviderLabel(wallState.policy.search_provider)}`;
          }
        }
        $("policySearchProvider")
          .querySelectorAll("option")
          .forEach(
            (option) =>
              (option.disabled =
                (option.value === "deepseek" || option.value === "qwen" || option.value === "bailian-deepseek") &&
                option.value !== $("policyModelProvider").value),
          );
        $("policyModelProvider").disabled = policyBusy;
        $("policySearchProvider").disabled = policyBusy;
        const deepSeekSearchSelected = $("policySearchProvider").value === "deepseek";
        $("deepSeekSearchChannelField").classList.toggle("hidden", !deepSeekSearchSelected);
        $("policyDeepSeekSearchChannel").disabled = policyBusy || !deepSeekSearchSelected;
        $("policyMemoryMode").disabled = policyBusy;
        $("policySkillsEnabled").disabled = policyBusy;
        $("policyTools")
          .querySelectorAll("input")
          .forEach((input) => (input.disabled = policyBusy));
        $("policyPresets")
          .querySelectorAll("input")
          .forEach((input) => (input.disabled = policyBusy || !$("policySkillsEnabled").checked));
        $("savePolicy").disabled = policyBusy;
        $("savePolicy").textContent = policyBusy
          ? "正在保存…"
          : policyDirty
            ? "保存课堂设置（有改动）"
            : "重新保存当前设置";
      }
      function markPolicyDirty() {
        policyDirty = true;
        $("policyStatus").textContent = "设置有改动，保存后立即对全班生效";
        renderPolicy();
      }
      $("policyMemoryMode").onchange = markPolicyDirty;
      $("policySkillsEnabled").onchange = markPolicyDirty;
      $("policyModelProvider").onchange = () => {
        const model = $("policyModelProvider").value;
        const search = $("policySearchProvider").value;
        if ((search === "deepseek" || search === "qwen" || search === "bailian-deepseek") && search !== model) {
          const available = wallState.available_search_providers || [];
          $("policySearchProvider").value = available.includes(model)
            ? model
            : available.includes("zhipu")
              ? "zhipu"
              : "disabled";
        }
        markPolicyDirty();
      };
      $("policySearchProvider").onchange = markPolicyDirty;
      $("policyDeepSeekSearchChannel").onchange = markPolicyDirty;
      $("savePolicy").onclick = async () => {
        if (!wallState || policyBusy) return;
        const requested = selectedPolicy();
        const previousRevision = Number(wallState.policy?.revision || 0);
        policyBusy = true;
        renderPolicy();
        try {
          const policy = await api("/api/teacher/policy", {
            method: "PUT",
            body: JSON.stringify(requested),
          });
          for (const key of ["model_provider", "search_provider", "deepseek_search_channel", "memory_mode", "skills_enabled"]) {
            if (policy[key] !== requested[key]) throw new Error(`服务器返回的 ${key} 与所选设置不一致`);
          }
          if (Number(policy.revision || 0) <= previousRevision) {
            throw new Error("服务器没有生成新的设置版本");
          }
          wallState.policy = policy;
          policyDirty = false;
          $("policyStatus").dataset.revision = String(policy.revision);
          $("policyStatus").textContent = `课堂设置已保存并同步给学生（版本 ${policy.revision}）`;
        } catch (e) {
          $("policyStatus").textContent = "保存失败：" + e.message;
        } finally {
          policyBusy = false;
          renderPolicy();
        }
      };
      window.addEventListener("beforeunload", (event) => {
        if (!policyDirty) return;
        event.preventDefault();
        event.returnValue = "";
      });
      function t(v, tag = "div") {
        const e = document.createElement(tag);
        e.textContent = v;
        return e;
      }
      $("lock").onclick = async () => {
        if (!wallState || lockBusy) return;
        const target = !wallState.run.locked;
        lockBusy = true;
        $("actionStatus").textContent = "";
        renderWall();
        try {
          const d = await api("/api/teacher/lock", {
            method: "POST",
            body: JSON.stringify({ locked: target }),
          });
          wallState.run.locked = d.locked;
          $("actionStatus").textContent = d.locked
            ? "全班已锁定"
            : "全班已解锁";
        } catch (e) {
          $("actionStatus").textContent = "切换失败：" + e.message;
        } finally {
          lockBusy = false;
          renderWall();
        }
      };
      $("newRun").onclick = async () => {
        if (runBusy) return;
        const name = prompt("新场次名称")?.trim();
        if (!name) return;
        if (
          !confirm(
            "新建场次会结束当前场次，并让所有学生重新登录。\n\n普通重启服务不会让学生重新登录；旧场次数据也会保留。\n\n确认新建吗？",
          )
        )
          return;
        runBusy = true;
        $("newRun").disabled = true;
        $("actionStatus").textContent = "正在新建场次…";
        try {
          await api("/api/teacher/run", {
            method: "POST",
            body: JSON.stringify({ name, ...selectedPolicy() }),
          });
          $("actionStatus").textContent = "新场次已创建，请让学生重新登录";
        } catch (e) {
          $("actionStatus").textContent = "新建失败：" + e.message;
        } finally {
          runBusy = false;
          $("newRun").disabled = false;
        }
      };
      $("logout").onclick = async () => {
        $("logout").disabled = true;
        try {
          await api("/api/teacher/logout", { method: "POST" });
          es?.close();
          location.reload();
        } catch (e) {
          $("actionStatus").textContent = "退出失败：" + e.message;
          $("logout").disabled = false;
        }
      };
      async function openStudent(id) {
        const d = await api("/api/teacher/student/" + encodeURIComponent(id));
        current = d;
        $("studentTitle").textContent = `${d.student.id}　${d.student.name}`;
        renderStudentUsage();
        const skills = (d.skills || [])
          .map(
            (skill) =>
              `${skill.enabled ? "✓" : "○"} ${skill.name}\n能力：${skill.summary || "（未填写）"}\n何时使用：${skill.when_to_use || "（未填写）"}\n触发：${skill.trigger_mode === "explicit" ? "仅明确调用" : "自动判断"}`,
          )
          .join("\n\n");
        const skillDisplay =
          wallState.policy.skills_enabled === false
            ? "本场课堂已关闭（原内容仍保留）"
            : skills || "（未创建）";
        $("design").textContent =
          `人设\n${d.design.persona || "（未填写）"}\n\nSkill 目录\n${skillDisplay}\n\n装备：${d.design.tools.map(toolLabel).join("、") || "无"}\n最大步数：${d.design.max_turns}`;
        $("messages").replaceChildren(
          ...d.messages.map((m) => {
            const e = document.createElement("div"),
              role = t(
                m.role === "user"
                  ? "学生"
                  : m.role === "assistant"
                    ? "Agent"
                    : "工具",
                "strong",
              ),
              content = document.createElement("div"),
              value = m.content || m.tool_calls;
            e.className = "msg " + m.role;
            role.className = "message-role";
            if (m.role === "assistant" && !m.tool_calls)
              MarkdownRenderer.render(content, value);
            else content.textContent = value;
            e.append(role, content);
            return e;
          }),
        );
        $("spotlightStatus").textContent = "";
        try {
          const activeDemo = await api("/api/teacher/screen-demo");
          demoStudentID = activeDemo.student_id || null;
          if (activeDemo.demo?.active) renderDemo(activeDemo.demo);
          else {
            demoState = null;
            $("demoControl").classList.add("hidden");
          }
        } catch (error) {
          demoStudentID = null;
          demoState = null;
          $("demoControl").classList.add("hidden");
          $("spotlightStatus").textContent = "读取大屏测试状态失败：" + error.message;
        }
        $("detailCard").classList.remove("hidden");
        $("wall").classList.add("hidden");
      }
      $("close").onclick = () => {
        $("detailCard").classList.add("hidden");
        $("wall").classList.remove("hidden");
        current = null;
      };
      $("resetUsage").onclick = async () => {
        if (!current || usageResetBusy) return;
        if (!confirm(`确认重置 ${current.student.name} 在当前场次的模型用量吗？\n\n对话、设计和 Memory 都会保留。`)) return;
        usageResetBusy = true;
        renderStudentUsage();
        try {
          const result = await api(`/api/teacher/student/${encodeURIComponent(current.student.id)}/usage/reset`, { method: "POST" });
          current.usage = result.usage;
          current.student_token_budget = result.student_token_budget;
          const wallStudent = wallState?.students?.find((student) => student.id === current.student.id);
          if (wallStudent) wallStudent.tokens_in = wallStudent.tokens_out = 0;
          $("spotlightStatus").textContent = "本场模型用量已重置";
        } catch (error) {
          $("spotlightStatus").textContent = "重置用量失败：" + error.message;
        } finally {
          usageResetBusy = false;
          renderStudentUsage();
        }
      };
      function renderDemo(state) {
        demoState = state;
        $("demoControl").classList.toggle("hidden", !state?.active);
        if (!state?.active) return;
        const differentStudent = Boolean(current && demoStudentID && demoStudentID !== current.student.id);
        $("demoStatus").textContent = differentStudent
          ? `当前正在演示 ${state.name}，结束后才能切换测试学生`
          : state.status || "等待教师输入";
        $("sendDemo").disabled = Boolean(differentStudent || state.running || demoController);
        $("demoInput").disabled = Boolean(differentStudent || state.running || demoController);
        $("startDemo").disabled = true;
        const nodes = [];
        let process = null;
        for (const message of state.messages || []) {
          const item = document.createElement("div"),
            role = t(message.role === "user" ? "教师提问" : message.role === "assistant" ? "Agent" : "工具", "strong"),
            content = document.createElement("div");
          role.className = "message-role";
          if (message.role === "assistant") MarkdownRenderer.render(content, message.content || "");
          else content.textContent = message.content || "";
          item.append(role, content);
          if (message.process) {
            if (!process) {
              const details = document.createElement("details"),
                summary = t("思考与行动过程", "summary"),
                items = document.createElement("div");
              details.className = "reasoning";
              items.className = "demo-process-items";
              details.append(summary, items);
              nodes.push(details);
              process = items;
            }
            item.className = "action";
            process.append(item);
          } else {
            process = null;
            item.className = "msg " + message.role;
            nodes.push(item);
          }
        }
        $("demoMessages").replaceChildren(...nodes);
        $("demoMessages").scrollTop = $("demoMessages").scrollHeight;
      }
      $("startDemo").onclick = async () => {
        if (!current || demoState?.active || demoController) return;
        $("startDemo").disabled = true;
        $("spotlightStatus").textContent = "正在创建大屏测试…";
        try {
          const result = await api("/api/teacher/screen-demo", {
            method: "POST",
            body: JSON.stringify({ student_id: current.student.id }),
          });
          demoStudentID = result.student_id;
          renderDemo(result.demo);
          $("spotlightStatus").textContent = result.screen_connections
            ? "测试对话已发送到大屏"
            : "测试已创建，但当前没有大屏连接";
        } catch (error) {
          $("spotlightStatus").textContent = "开始测试失败：" + error.message;
        } finally {
          $("startDemo").disabled = Boolean(demoState?.active);
        }
      };
      $("demoForm").onsubmit = async (event) => {
        event.preventDefault();
        const message = $("demoInput").value.trim();
        if (!message || !demoState?.active || demoController || demoStudentID !== current?.student.id) return;
        demoController = new AbortController();
        $("demoInput").value = "";
        renderDemo({ ...demoState, running: true, status: "正在提交问题…" });
        try {
          const response = await fetch("/api/teacher/screen-demo/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ demo_id: demoState.id, message }),
            signal: demoController.signal,
          });
          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.error?.message || "测试对话失败");
          }
          const reader = response.body.getReader(),
            parser = NDJSONStream.createParser((item) => {
              if (item.demo) renderDemo(item.demo);
            });
          while (true) {
            const { value, done } = await reader.read();
            parser.push(value, done);
            if (done) break;
          }
        } catch (error) {
          if (error.name !== "AbortError") $("demoStatus").textContent = error.message;
        } finally {
          demoController = null;
          if (demoState) renderDemo(demoState);
        }
      };
      $("demoInput").onkeydown = (event) => {
        if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          $("demoForm").requestSubmit();
        }
      };
      $("stopDemo").onclick = async () => {
        demoController?.abort();
        demoController = null;
        try {
          const result = await api("/api/teacher/screen-demo", { method: "DELETE" });
          demoStudentID = null;
          renderDemo(result.demo);
          $("startDemo").disabled = false;
          $("spotlightStatus").textContent = "大屏测试已结束";
        } catch (error) {
          $("demoStatus").textContent = "结束测试失败：" + error.message;
        }
      };
      $("spotlight").onclick = async () => {
        if (!current) return;
        $("spotlight").disabled = true;
        $("spotlightStatus").textContent = "正在等待大屏确认…";
        try {
          const d = await api("/api/teacher/spotlight", {
            method: "POST",
            body: JSON.stringify({ id: current.student.id, turn_id: "" }),
          });
          $("spotlightStatus").textContent = d.delivered
            ? "大屏已确认显示"
            : "内容已保存，但未收到大屏显示确认，请检查大屏连接";
        } catch (e) {
          $("spotlightStatus").textContent = "推送失败：" + e.message;
        } finally {
          $("spotlight").disabled = false;
        }
      };
    </script>
  </body>
</html>
